[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scounter"
version = "0.1.0"
description = "A polite, resumable Instagram media archiver (cookies-only, full-HD)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scounter contributors" }]
keywords = ["instagram", "archiver", "scraper", "downloader", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "instagrapi>=2.5,<3",
    "requests>=2.28",
]

[project.optional-dependencies]
tor = [
    "stem>=1.8",
    "PySocks>=1.7",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
]

[project.scripts]
scounter = "scounter.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/scounter"
Issues = "https://github.com/yourusername/scounter/issues"

[tool.setuptools.packages.find]
include = ["scounter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
